name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Test
        run: cargo test --locked

      - name: Format
        run: cargo fmt --check

      # Pinned where the others are not. `-D warnings` makes clippy's lint set
      # part of the gate, and that set grows with every release, so an unpinned
      # clippy fails a branch nobody changed on a day nobody chose. This is the
      # version `flake.nix` provides, so clippy clean on a machine is clippy
      # clean here; the two move in the same change or not at all.
      - name: Clippy
        run: |
          rustup toolchain install 1.97 --profile minimal --component clippy
          cargo +1.97 clippy --all-targets --locked -- -D warnings
